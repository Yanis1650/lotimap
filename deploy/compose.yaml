name: lotimap

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LOTIMAP_ADMIN_PASSWORD: ${LOTIMAP_ADMIN_PASSWORD:-}
      LOTIMAP_SESSION_SECRET: ${LOTIMAP_SESSION_SECRET:-}
    volumes:
      - sales:/app/state
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/lots').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sales:
